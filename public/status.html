<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Statut — Vimen</title>
<style>
  :root {
    --brand: #E9622F;
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --border: #E5E5E0;
    --text: #1A1A1A;
    --muted: #6B6B66;
    --green: #16A34A;
    --yellow: #D97706;
    --red: #DC2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
  header { text-align: center; margin-bottom: 32px; }
  header h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  header p { color: var(--muted); font-size: 14px; margin: 0; }

  .banner {
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 15px;
  }
  .banner.operational { background: #ECFDF5; color: var(--green); border: 1px solid #A7F3D0; }
  .banner.degraded    { background: #FFFBEB; color: var(--yellow); border: 1px solid #FDE68A; }
  .banner.outage      { background: #FEF2F2; color: var(--red); border: 1px solid #FECACA; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  .components {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 32px;
  }
  .component-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .component-row:last-child { border-bottom: none; }
  .status-pill {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .status-pill.operational { background: #ECFDF5; color: var(--green); }
  .status-pill.degraded    { background: #FFFBEB; color: var(--yellow); }
  .status-pill.outage      { background: #FEF2F2; color: var(--red); }

  h2 { font-size: 15px; font-weight: 800; margin: 0 0 14px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }

  .incident {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }
  .incident-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .incident-date { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .incident-updates { border-left: 2px solid var(--border); padding-left: 14px; margin-top: 10px; }
  .incident-update { font-size: 13px; margin-bottom: 8px; }
  .incident-update .time { color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 700; margin-right: 6px; }

  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 24px; }
  footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Statut Vimen</h1>
      <p id="last-updated">Chargement...</p>
    </header>

    <div id="banner" class="banner operational">
      <span class="dot"></span>
      <span id="banner-text">Chargement du statut...</span>
    </div>

    <div class="components" id="components"></div>

    <h2>Historique des incidents</h2>
    <div id="incidents"></div>

    <footer>
      Un problème ? <a href="mailto:contact@vimen.app">contact@vimen.app</a>
    </footer>
  </div>

  <script>
    const STATUS_LABELS = {
      operational: "Opérationnel",
      degraded: "Dégradé",
      outage: "Panne",
    };

    async function loadStatus() {
      try {
        const res = await fetch("./status-data.json?t=" + Date.now());
        const data = await res.json();
        render(data);
      } catch (e) {
        document.getElementById("banner-text").textContent = "Impossible de charger le statut.";
      }
    }

    function render(data) {
      // Bannière globale : le pire statut parmi tous les composants gagne
      const severities = { operational: 0, degraded: 1, outage: 2 };
      let worst = "operational";
      for (const c of data.components) {
        if (severities[c.status] > severities[worst]) worst = c.status;
      }
      const banner = document.getElementById("banner");
      banner.className = "banner " + worst;
      const bannerMsg = {
        operational: "Tous les systèmes sont opérationnels",
        degraded: "Certains systèmes rencontrent des perturbations",
        outage: "Panne en cours sur un ou plusieurs systèmes",
      };
      document.getElementById("banner-text").textContent = bannerMsg[worst];

      document.getElementById("last-updated").textContent =
        "Dernière mise à jour : " + new Date(data.lastUpdated).toLocaleString("fr-FR");

      // Composants
      const compEl = document.getElementById("components");
      compEl.innerHTML = data.components.map(c => `
        <div class="component-row">
          <span>${c.name}</span>
          <span class="status-pill ${c.status}">${STATUS_LABELS[c.status]}</span>
        </div>
      `).join("");

      // Incidents
      const incEl = document.getElementById("incidents");
      if (!data.incidents || data.incidents.length === 0) {
        incEl.innerHTML = '<div class="empty">Aucun incident récent.</div>';
        return;
      }
      incEl.innerHTML = data.incidents.map(inc => `
        <div class="incident">
          <div class="incident-title">${inc.title}</div>
          <div class="incident-date">${new Date(inc.date).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })}</div>
          <div class="incident-updates">
            ${inc.updates.map(u => `
              <div class="incident-update">
                <span class="time">${u.time}</span>${u.text}
              </div>
            `).join("")}
          </div>
        </div>
      `).join("");
    }

    loadStatus();
  </script>
</body>
</html>
